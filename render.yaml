services:
  # -------------------------------------------------------------------------
  # 1. InfraMind FastAPI Backend (Render Web Service with Persistent Disk)
  # -------------------------------------------------------------------------
  - type: web
    name: inframind-backend
    runtime: python
    region: oregon
    plan: starter # Starter plan supports attaching Render Persistent Disk
    buildCommand: "./backend/render-build.sh"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    disk:
      name: inframind-storage
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIRECTORY
        value: /var/data
      - key: UPLOAD_DIRECTORY
        value: /var/data/uploads
      - key: CHROMA_PERSIST_DIRECTORY
        value: /var/data/chroma
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3.8-flash,gemini-3.1-flash-lite"
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GEMINI_API_KEY
        sync: false # Must be set securely in Render Dashboard (never committed)
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: inframind-frontend
          property: host

  # -------------------------------------------------------------------------
  # 2. InfraMind React + Vite Frontend (Render Static Site)
  # -------------------------------------------------------------------------
  - type: web
    name: inframind-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: inframind-backend
          property: host
